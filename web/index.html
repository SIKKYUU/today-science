<!doctype html>
<html lang="ko">
<head>
  <!-- 한글이 깨지지 않도록 글자 인코딩을 정한다 -->
  <meta charset="utf-8">
  <!-- 휴대폰 화면 폭에 맞추고, 노치·홈 막대 영역까지 화면을 꽉 채운다(viewport-fit=cover) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>오늘 과학</title>
  <!-- 검색엔진에 이 페이지를 올리지 말고(noindex), 링크도 따라가지 말라고(nofollow) 알린다 -->
  <meta name="robots" content="noindex, nofollow">

  <!-- ==== 앱처럼 쓰기(PWA) ==== -->
  <!-- 앱 정보(이름, 아이콘, 시작 주소)를 담은 파일 -->
  <link rel="manifest" href="manifest.json">
  <!-- 브라우저 위쪽 막대 색 -->
  <meta name="theme-color" content="#FDFDFB">
  <!-- 아이폰: 홈 화면에서 열면 주소창 없는 앱 모드로 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- 아이폰: 상태 표시줄은 기본(밝은 배경에 검은 글씨) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- 아이폰: 홈 화면 아이콘 아래 이름 -->
  <meta name="apple-mobile-web-app-title" content="오늘 과학">
  <!-- 아이폰 홈 화면 아이콘 (180×180) -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- 브라우저 탭 아이콘: SVG를 먼저, 못 쓰는 브라우저는 PNG -->
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">

  <!-- 구글 폰트 서버에 미리 연결해 글꼴을 빨리 받는다 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 글꼴 3종: 본문·제목(IBM Plex Sans KR), 라벨·숫자(IBM Plex Mono), 손글씨(Nanum Pen Script) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Nanum+Pen+Script&display=swap">
  <!-- 디자인(색, 글자 크기, 배치)은 style.css에 있다 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 오프라인일 때만 보이는 손글씨 안내 (app.js가 켜고 끈다) -->
  <p id="offline" class="pen offline" hidden>오프라인 · 저장된 기록을 보여줘요</p>
  <!-- 화면 전체를 담는 상자. 내용은 app.js가 채운다 -->
  <main id="app">
    <p class="status">관찰 기록을 불러오는 중이에요…</p>
  </main>
  <!-- 동작(데이터 읽기, 화면 그리기, 오프라인 준비)은 app.js에 있다 -->
  <script src="app.js"></script>
</body>
</html>
