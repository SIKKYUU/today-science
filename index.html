<!doctype html>
<html lang="ko">
<head>
  <!-- 한글이 깨지지 않도록 글자 인코딩을 정한다 -->
  <meta charset="utf-8">
  <!-- 휴대폰에서 화면 폭에 맞게 보이도록 한다 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘 과학</title>
  <!-- 검색엔진에 이 페이지를 올리지 말고(noindex), 링크도 따라가지 말라고(nofollow) 알린다 -->
  <meta name="robots" content="noindex, nofollow">
  <!-- 브라우저 탭 아이콘 (web 폴더의 앱 아이콘을 같이 쓴다) -->
  <link rel="icon" href="web/icon.svg" type="image/svg+xml">
  <link rel="icon" href="web/icon-192.png" sizes="192x192" type="image/png">
  <!-- 0초 뒤 web 폴더로 이동한다 (자바스크립트가 꺼져 있어도 동작) -->
  <meta http-equiv="refresh" content="0; url=web/">
  <!-- 자바스크립트로도 바로 이동한다 (뒤로 가기 때 이 빈 페이지가 다시 나오지 않게 replace 사용) -->
  <script>location.replace("web/");</script>
</head>
<body>
  <!-- 자동 이동이 안 될 때 누를 수 있는 링크 -->
  <p><a href="web/">오늘 과학으로 이동하기</a></p>
</body>
</html>
